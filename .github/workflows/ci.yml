name: CI
# Manual only (owner ruling, 2026-11-11): GitHub Actions minutes are not to be
# spent automatically. Verification is local: scripts/check.sh (fast gate) at
# every commit, and scripts/check.sh --full on demand at milestone close.
# This workflow, heavy.yml and fuzz.yml run only when started by hand from the
# Actions tab.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the required GPU environment: Mesa lavapipe (software
          # Vulkan) runs every render and GUI test, and skips fail the build.
          # It also fetches the real scan fixtures, so their tests can't skip.
          - os: ubuntu-24.04
            require_gpu: "1"
            require_fixtures: "1"
          - os: macos-latest
            require_gpu: "0"
            require_fixtures: "0"
          - os: windows-latest
            require_gpu: "0"
            require_fixtures: "0"
    runs-on: ${{ matrix.os }}
    env:
      MF_REQUIRE_GPU: ${{ matrix.require_gpu }}
      MF_REQUIRE_FIXTURES: ${{ matrix.require_fixtures }}
      MF_SKIP_LOG: ${{ github.workspace }}/skipped-tests.txt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI and software-Vulkan deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Real scan fixtures (hash-verified)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: fixtures/real
          key: real-fixtures-${{ hashFiles('fixtures/manifest.txt') }}
      - name: Fixture fetcher tests (hash checks, plain-file entries)
        if: runner.os == 'Linux'
        run: scripts/test-fetch-fixtures.sh
      - name: Fetch real scan fixtures
        if: runner.os == 'Linux'
        run: scripts/fetch-fixtures.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: No unreviewed error swallowing (MF-ISSUE-004/022)
        if: runner.os == 'Linux'
        run: |
          scripts/test-check-swallowed.sh
          scripts/check-swallowed-defaults.sh
      - name: Test (fast suite; heavy/timing/5M groups run on demand in heavy.yml)
        shell: bash
        run: |
          set -o pipefail
          # Owner ruling (2026-11-09): heavy, timing and 5M tests run on demand,
          # after work is complete and proven (workflow "Heavy tests", heavy.yml),
          # never on every push.
          scripts/run-tests.sh --fast 2>&1 | tee test-output.txt
      - name: Test summary
        if: always()
        shell: bash
        run: scripts/ci-test-summary.sh test-output.txt "$MF_SKIP_LOG"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-output.txt
            skipped-tests.txt
          if-no-files-found: warn

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

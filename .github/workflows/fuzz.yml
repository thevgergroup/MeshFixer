name: Fuzz
# MF-IO-002 fuzzing is on-demand only (owner ruling): no
# push, scheduled or ordinary pull-request runs. Started either from the
# Actions tab (choose the minutes per target), or by a person adding the
# `run-fuzz` label to a PR (controller ruling, 2026-11-10: GitHub can only
# dispatch a workflow once it's on the default branch, and this one isn't
# yet, so the labeled trigger is how it's started from a PR branch until
# then; label-triggered runs default to 10 minutes per target). The job is
# guarded to run only when the label just added is `run-fuzz`, so adding
# any other label never starts this workflow.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz each target (stl, obj, threemf)
        required: true
        default: "15"
        type: string
  pull_request:
    types: [labeled]

env:
  CARGO_TERM_COLOR: never

jobs:
  fuzz:
    # MF-IO-002: malformed, truncated or malicious STL/OBJ/3MF input must
    # fail fast with a structured error, never panic, allocate unboundedly
    # or hang. `fuzz/` is its own workspace (cargo-fuzz's standard layout,
    # excluded from the main workspace) so this nightly-only build never
    # touches the pinned stable toolchain used everywhere else.
    # On demand only (owner ruling): run it from the Actions tab, or by
    # adding the `run-fuzz` label to a PR (10 minutes per target then).
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-fuzz'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [stl, obj, threemf]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-v0.13.2
      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz ${{ matrix.target }} (${{ github.event_name == 'workflow_dispatch' && inputs.minutes || '10' }} min)
        working-directory: fuzz
        env:
          MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.minutes || '10' }}
        run: |
          case "$MINUTES" in
            ''|*[!0-9]*) echo "::error::minutes must be a whole number, got '$MINUTES'"; exit 1 ;;
          esac
          seconds=$((MINUTES * 60))
          cargo fuzz run ${{ matrix.target }} -- \
            -rss_limit_mb=2048 -max_len=1048576 -max_total_time="$seconds"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

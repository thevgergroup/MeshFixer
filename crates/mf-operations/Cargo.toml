[package]
name = "mf-operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Test-only: registers `test.unit_conversion`, matching mf-spec's
# `test-kinds`-gated spec of the same id, so mf-command's tests can
# exercise real unit-conversion wiring end to end. Off in every normal
# build; only mf-command's dev-dependency enables it.
# Also registers `test.consume_tool`, a stand-in for a boolean (removes
# its tool operand and creates an object) for multi-object command tests.
# And mf-parts' test-only generators.
test-kinds = ["mf-spec/test-kinds", "mf-parts/test-kinds"]


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="faceA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#2f8fd8"/>
    </linearGradient>
    <linearGradient id="faceB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4bb3f0"/>
      <stop offset="1" stop-color="#1d5e9e"/>
    </linearGradient>
    <linearGradient id="faceC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#e8743b"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- upper piece of a faceted gem (a low-poly mesh), cut on a tilted plane -->
  <g stroke="#dff3ff" stroke-width="10" stroke-linejoin="round">
    <polygon points="512,200 300,380 512,430" fill="url(#faceA)"/>
    <polygon points="512,200 724,380 512,430" fill="url(#faceB)"/>
    <polygon points="300,380 250,520 512,470 512,430" fill="url(#faceB)"/>
    <polygon points="724,380 774,560 512,470 512,430" fill="url(#faceA)"/>
  </g>
  <!-- lower piece, moved down along the cut: the split -->
  <g stroke="#fff1e2" stroke-width="10" stroke-linejoin="round">
    <polygon points="250,580 512,530 512,620" fill="url(#faceC)"/>
    <polygon points="774,620 512,530 512,620" fill="#d9652f"/>
    <polygon points="250,580 512,620 512,830" fill="#e8743b"/>
    <polygon points="774,620 512,620 512,830" fill="#c4542a"/>
  </g>
  <!-- the alignment peg joining the two pieces -->
  <rect x="490" y="450" width="44" height="110" rx="14" fill="#f4f7fb" stroke="#151a24" stroke-width="8"/>
</svg>

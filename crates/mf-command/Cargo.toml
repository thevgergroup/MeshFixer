[package]
name = "mf-command"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Test-only (MF-ISSUE-046): with this on and MF_TEST_POSITION_JITTER set,
# every coordinate of every vertex an operation creates is scaled by
# 1 ± that fraction before hashing, imitating another platform's floating
# point, to record logs that must replay as `Equivalent`. Off in
# every normal and test build; nothing in the workspace enables it.
test-position-jitter = []

[dependencies]
mf-runtime.workspace = true
mf-selection.workspace = true
serde.workspace = true
mf-document.workspace = true
mf-geometry.workspace = true
mf-io.workspace = true
mf-spec.workspace = true
mf-operations.workspace = true
mf-units.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
glam.workspace = true
mf-parts.workspace = true
mf-boolean.workspace = true
mf-fixtures.workspace = true
mf-document = { workspace = true, features = ["test-kinds"] }
mf-operations = { workspace = true, features = ["test-kinds"] }
mf-selection.workspace = true
tempfile.workspace = true
rayon.workspace = true
blake3.workspace = true
serde_json.workspace = true

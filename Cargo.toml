[workspace]
resolver = "3"
members = ["crates/*"]
# The C++ Manifold binding (Phase 1 Task 7b) is a workspace member: it is
# the shipping boolean kernel (ADR-0002 option B, Task 8), built by
# mf-boolean's default `manifold-cpp` feature. Verified on macOS only.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thevgergroup/MeshFixer"

[workspace.dependencies]
mf-geometry = { path = "crates/mf-geometry" }
mf-fixtures = { path = "crates/mf-fixtures" }
mf-units = { path = "crates/mf-units" }
mf-io = { path = "crates/mf-io" }
mf-spec = { path = "crates/mf-spec" }
mf-operations = { path = "crates/mf-operations" }
mf-command = { path = "crates/mf-command" }
mf-render = { path = "crates/mf-render" }
mf-metrics = { path = "crates/mf-metrics" }
mf-document = { path = "crates/mf-document" }
mf-selection = { path = "crates/mf-selection" }
mf-runtime = { path = "crates/mf-runtime" }
mf-boolean = { path = "crates/mf-boolean" }
mf-parts = { path = "crates/mf-parts" }
mf-manifold-sys = { path = "crates/mf-manifold-sys" }

blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
rayon = "1.12"
zip = { version = "9.4", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-saphyr = "2.1"
clap = { version = "4.6", features = ["string"] }
thiserror = "2"
glam = "0.30"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui = "0.37"
egui-wgpu = "0.37"
rfd = "0.18"
jsonschema = "0.60"
tempfile = "3"
ctrlc = "3.5"
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# The fill-reducing (AMD) ordering for the fairing solve (MF-OP-002,
# MF-ISSUE-053; owner-approved 2026-11-09). Integer-only; the numeric
# factorisation is our own scalar code, so results stay bit-identical
# across CPUs (faer's SIMD kernels pick a width per machine).
# D1: the boolean kernel, exact (rational) engine only, behind
# mf-boolean::Kernel. Pinned: its qualification (Phase 1 Task 7, ADR-0002)
# is for this exact version.
manifold-rust = { version = "=0.19.2", default-features = false, features = ["parallel"] }
# D2: Shewchuk's adaptive exact predicates.
robust = "1.2"
# D3: cut-cap triangulation (constrained Delaunay, exact predicates).
spade = "2.15"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Line tables only: backtraces and panics keep file and line numbers, but the
# full variable debug info (most of target/'s size and link time) is dropped.
# The test profile inherits this. To step through locals in a debugger, set
# CARGO_PROFILE_DEV_DEBUG=true for that build.
[profile.dev]
debug = "line-tables-only"

# The geometry hot paths are optimised even in test builds so tests on real
# scans (1M triangles) run in seconds, not minutes. Debug assertions and
# overflow checks stay on.
[profile.dev.package.mf-geometry]
opt-level = 2

[profile.dev.package.mf-io]
opt-level = 2

[profile.dev.package.mf-operations]
opt-level = 2

[profile.dev.package.faer]
opt-level = 2

# Picking (the BVH build and its ray casts, MF-RENDER-004) runs in tests
# and the app at release-like speed: the < 16 ms pick budget is measured
# in the test harness.
[profile.dev.package.mf-render]
opt-level = 2

# Cancellation checkpoints and the cancellable sort sit in every hot loop.
[profile.dev.package.mf-runtime]
opt-level = 2

# Import hashes every byte it reads, and revisions hash their chunks:
# unoptimised, BLAKE3 runs at ~60 MB/s (4 s for a 5M-triangle STL).
[profile.dev.package.blake3]
opt-level = 2

# MF-RT-001's frame-time gate (mf-desktop/tests/progress.rs) times whole
# frames in the test harness. Unoptimised, egui's tessellation and the
# harness's frame read-back alone take ~70 ms, which would measure the test
# plumbing rather than the app.
[profile.dev.package.egui_kittest]
opt-level = 2

[profile.dev.package.epaint]
opt-level = 2

[profile.dev.package.egui]
opt-level = 2

[profile.dev.package.egui-wgpu]
opt-level = 2

# The boolean kernel (D1) and its rational arithmetic run at release speed
# in tests: the Task 7 qualification times 1M-triangle booleans in the test
# harness, and unoptimised exact arithmetic would measure the build, not
# the kernel. Their debug assertions and overflow checks are off (they are
# third-party crates); ours stay on.
[profile.dev.package.manifold-rust]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.dashu-int]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.dashu-ratio]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.dashu-base]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.robust]
opt-level = 3

[profile.dev.package.mf-boolean]
opt-level = 2

id: object.set_transform
version: 1
summary: Place an object by setting its whole transform (move, rotate and scale in one step).
history_label: history.label.object.set_transform
geometry_kinds: [mesh]
target:
  whole_object: true
  kinds: []
parameters:
  - name: transform
    type: affine
    # The absolute resulting placement (D7), never a delta: the gizmo and
    # the numeric fields compute it, so replay runs no trigonometry and is
    # Exact on every OS.
    default: [1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0]
    description: "The object's new placement: 12 numbers m00,m01,m02,m10,m11,m12,m20,m21,m22 (the 3x3 linear part, row by row, 3MF order) then the translation x,y,z"
preconditions:
  - target is a whole object
  - the transform's linear part is invertible (determinant not zero)
postconditions:
  - the object's transform is exactly the given 12 values
  - geometry unchanged and shared with the previous revision
  - nothing changes (no revision) if the transform is already exactly this
effects: [transform_changes]
runtime:
  cancellable: true
  progress: false
# ADR-0009: the transform is the whole resulting placement, not a delta,
# so a newly queued set_transform may merge into the one already
# waiting (same target), latest params winning.
coalesce: absolute

id: mesh.boolean
version: 1
summary: Combine the target with a tool object (union, subtract or intersect), locally around the tool, with an exact check of the result.
history_label: history.label.mesh.boolean
geometry_kinds: [mesh]
target:
  whole_object: true
  kinds: []
operands:
  # The tool, consumed (removed once the command commits) unless
  # keep_tool is set (D10). Brought into the target's frame first, so the
  # target keeps its id, name, transform and every face outside the
  # window, bitwise.
  - name: tool
    role: consumed
    kinds: [object, component]
    required: true
parameters:
  - name: operation
    type: choice
    values: [union, subtract, intersect]
    default: union
    description: "union: keep both; subtract: cut the tool out of the target; intersect: keep only the overlap"
  - name: keep_tool
    type: bool
    default: false
    description: Keep the tool object instead of removing it
  - name: blend_width
    type: float
    default: 0.0
    min: 0.0
    unit: mm
    # P1-M5's blend (D13, D14, Task 22): union only.
    description: "Width of the blended seam, along the surface (0 for a sharp seam); union only"
  - name: embed_depth
    type: float
    default: 0.0
    min: 0.0
    unit: mm
    description: "How far an open part (a stamp) is sunk into the surface before the union; 0 means half the blend width"
preconditions:
  - the target and the tool are meshes; the tool is closed
  - for subtract and intersect, the target is closed (D15)
  - the tool and the target touch (otherwise no_overlap)
postconditions:
  - the result is closed (except openings the target had away from the tool), manifold, consistently oriented, with no degenerate face and no new self-intersection, checked exactly (D4); otherwise refused by name
  - faces of the target outside the window around the tool are kept bitwise with their ids (D5)
  - every created face names its source, a target face or a tool face (operand 1)
  - a temporary closure of a target opening never survives (D15)
effects: [geometry_changes, topology_changes, removes_objects]
runtime:
  cancellable: true
  progress: true
# ADR-0010, consolidation plan C14: every refusal mesh.boolean can
# return, through the one registry helper (crate::refusal::refuse),
# including mesh.blend's own codes (the blend step runs inside this
# op's union; it has no spec of its own).
refusals:
  - code: operand_not_closed
    message: refusal.operand_not_closed
    next: repair
  - code: tool_not_closed
    message: refusal.tool_not_closed
    next: repair
  - code: opening_not_covered
    message: refusal.opening_not_covered
    next: repair
  - code: opening_too_large_for_join
    message: refusal.opening_too_large_for_join
    next: repair
  - code: no_overlap
    message: refusal.no_overlap
    next: none
  - code: operand_overlaps_itself
    message: refusal.operand_overlaps_itself
    next: run_make_solid
  - code: section_self_intersects
    message: refusal.section_self_intersects
    next: run_make_solid
  - code: window_degenerate
    message: refusal.window_degenerate
    next: run_make_solid
  - code: result_not_manifold
    message: refusal.result_not_manifold
    next: none
  - code: result_self_intersects
    message: refusal.result_self_intersects
    next: none
  - code: result_empty
    message: refusal.result_empty
    next: none
  - code: kernel_internal
    message: refusal.kernel_internal
    next: none
  - code: blend_needs_union
    message: refusal.blend_needs_union
    next: none
  - code: blend_self_intersects
    message: refusal.blend_self_intersects
    next: none
  - code: blend_did_not_converge
    message: refusal.blend_did_not_converge
    next: none
  - code: blend_too_wide
    message: refusal.blend_too_wide
    next: none
  - code: blend_too_narrow
    message: refusal.blend_too_narrow
    next: none
  - code: stamp_not_embedded
    message: refusal.stamp_not_embedded
    next: none

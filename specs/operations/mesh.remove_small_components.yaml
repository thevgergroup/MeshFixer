id: mesh.remove_small_components
# Version 2 adds max_relative_size (MF-ISSUE-052). Version 1 records replay
# with max_relative_size 100: no relative limit, exactly as they ran.
version: 2
summary: Delete disconnected islands smaller than a triangle-count threshold and a share of the largest piece.
geometry_kinds: [mesh]
target:
  whole_object: true
  kinds: [component]
parameters:
  - name: max_triangles
    type: integer
    default: 100
    min: 1
    description: Remove components with fewer triangles than this
  - name: max_relative_size
    type: float
    # Keeps parts comparable to the main body (a handle, a second shell);
    # the specks around a scan are far below 1% of it. Many-part designs
    # whose parts are each under 1% (the Verlan dress's trim, unwelded
    # soup) are still candidates: the desktop previews them and asks before
    # removing more than 3% of the triangles (or most pieces and over 2%).
    default: 1.0
    min: 0.0
    max: 100.0
    unit: "%"
    description: Only remove pieces no bigger than this share of the largest piece's triangles (whole-object runs; chosen pieces are always removed)
  - name: keep_largest
    type: bool
    default: true
    description: Never remove the largest component, even if it is below the threshold
preconditions:
  - target is a mesh
postconditions:
  - on a whole-object run, every remaining component has at least max_triangles triangles, more than max_relative_size percent of the largest component's triangles, or is the largest
  - kept faces are unchanged and keep their relative order
effects: [geometry_changes, topology_changes]
runtime:
  cancellable: true
  progress: true

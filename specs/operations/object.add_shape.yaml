id: object.add_shape
version: 1
summary: Add parametric shapes (library shapes, or a connector's linked parts) as new objects that keep their recipe, placed on the target.
history_label: history.label.object.add_shape
geometry_kinds: [mesh]
target:
  whole_object: true
  kinds: []
parameters:
  - name: shapes
    type: text
    default: "[]"
    description: "The shapes to add, as JSON: a list of {generator: {id, version, params, part?}, name, hole}; each becomes one object, in order"
  - name: transform
    type: affine
    default: [1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0]
    description: "Where the shapes go: their absolute placement, 12 numbers (3x3 linear part row by row, then translation)"
  - name: group
    type: text
    default: ""
    description: "The linked group the new objects belong to (a connector placed as several objects); empty for none"
preconditions:
  - every recipe names a shape or connector this build has, at its recorded version
postconditions:
  - one new object per shape, at the given transform, with its recipe as its generator property
  - a shape marked hole gets the Hole role
  - the target is unchanged
effects: [creates_objects]
runtime:
  cancellable: true
  progress: false
# ADR-0010, consolidation plan C14: a shape's own generator can refuse
# (mf_parts::regenerate's own structural codes, plus a generator's own —
# hinge.leaf's are declared here; another generator's own code is still
# a declared OpError::Refused, through the same registry helper, even
# where this list doesn't yet name it).
refusals:
  - code: unknown_generator
    message: refusal.unknown_generator
    next: none
    args:
      - name: detail
        kind: text
  - code: generator_version
    message: refusal.generator_version
    next: none
    args:
      - name: detail
        kind: text
  - code: unknown_part
    message: refusal.unknown_part
    next: none
    args:
      - name: detail
        kind: text
  - code: moving_parts_fused
    message: refusal.moving_parts_fused
    next: none
    args:
      - name: detail
        kind: text
  - code: too_few_knuckles
    message: refusal.too_few_knuckles
    next: none
    args:
      - name: detail
        kind: text
  - code: pin_too_wide
    message: refusal.pin_too_wide
    next: none
    args:
      - name: detail
        kind: text
  - code: leaf_too_thick
    message: refusal.leaf_too_thick
    next: none
    args:
      - name: detail
        kind: text
  - code: hinge_too_short
    message: refusal.hinge_too_short
    next: none
    args:
      - name: detail
        kind: text
  - code: leaf_failed
    message: refusal.leaf_failed
    next: none
    args:
      - name: detail
        kind: text

id: mesh.combine
version: 1
summary: Join every solid and cut every hole (Tinkercad-style grouping), as one command with an exact check of each step.
history_label: history.label.mesh.combine
geometry_kinds: [mesh]
# The first solid: it keeps its id, name and transform, and receives the
# result. The other solids and the holes are brought into its frame (D10).
target:
  whole_object: true
  kinds: []
operands:
  # The other solids, unioned onto the target in order, then removed.
  - name: solids
    role: consumed
    kinds: [object]
    required: false
    many: true
  # The holes, each subtracted from the joined solids in order, then
  # removed unless keep_holes is set.
  - name: holes
    role: consumed
    kinds: [object]
    required: false
    many: true
parameters:
  - name: keep_holes
    type: bool
    default: false
    description: Keep the hole objects instead of removing them
preconditions:
  - every solid and hole is a closed mesh
  - at least one other solid or one hole is given (otherwise nothing_to_combine)
  - each solid and hole touches what it joins or cuts (otherwise no_overlap, naming it)
postconditions:
  - the result is checked exactly after every step (D4); a refused step names the object at fault and nothing commits
  - every created face names its source, a face of the first solid (operand 0), another solid or a hole
  - one command, one undo step; undo restores every removed object with its id
effects: [geometry_changes, topology_changes, removes_objects]
runtime:
  cancellable: true
  progress: true
# ADR-0010, consolidation plan C14: every step is a mesh.boolean step on
# the same kernel and validator, so a refused step can return any of
# mesh.boolean's codes (named by object through refuse_naming), plus
# mesh.combine's own.
refusals:
  - code: nothing_to_combine
    message: refusal.nothing_to_combine
    next: none
    args:
      - name: object
        kind: text
  - code: operand_not_closed
    message: refusal.operand_not_closed
    next: repair
    args:
      - name: object
        kind: text
  - code: tool_not_closed
    message: refusal.tool_not_closed
    next: repair
    args:
      - name: object
        kind: text
  - code: opening_not_covered
    message: refusal.opening_not_covered
    next: repair
    args:
      - name: object
        kind: text
  - code: opening_too_large_for_join
    message: refusal.opening_too_large_for_join
    next: repair
    args:
      - name: object
        kind: text
  - code: no_overlap
    message: refusal.no_overlap
    next: none
    args:
      - name: object
        kind: text
  - code: operand_overlaps_itself
    message: refusal.operand_overlaps_itself
    next: run_make_solid
    args:
      - name: object
        kind: text
  - code: section_self_intersects
    message: refusal.section_self_intersects
    next: run_make_solid
    args:
      - name: object
        kind: text
  - code: window_degenerate
    message: refusal.window_degenerate
    next: run_make_solid
    args:
      - name: object
        kind: text
  - code: result_not_manifold
    message: refusal.result_not_manifold
    next: none
    args:
      - name: object
        kind: text
  - code: result_self_intersects
    message: refusal.result_self_intersects
    next: none
    args:
      - name: object
        kind: text
  - code: result_empty
    message: refusal.result_empty
    next: none
    args:
      - name: object
        kind: text
  - code: kernel_internal
    message: refusal.kernel_internal
    next: none
    args:
      - name: object
        kind: text

id: object.set_shape_params
version: 1
summary: Regenerate editable shapes from new recipes, keeping each object's id, name, transform and role.
history_label: history.label.object.set_shape_params
geometry_kinds: [mesh]
# Every member of a linked group at once: the first is the target, the
# rest are extra targets, each with its own recipe in `generators`.
target:
  whole_object: true
  kinds: []
  many: true
parameters:
  - name: generators
    type: text
    default: "[]"
    description: "The new recipes, as JSON: one {id, version, params, part?} per target, in order"
preconditions:
  - one recipe per target
  - every recipe names a shape or connector this build has, at its recorded version
postconditions:
  - each target's mesh is regenerated from its recipe, and its generator property is that recipe
  - one command, one undo step
effects: [geometry_changes, topology_changes]
runtime:
  cancellable: true
  progress: false
# ADR-0009: each target's recipe is the whole resulting state, not a
# delta, so a newly queued set_shape_params may merge into the one
# already waiting (same target), latest params winning.
coalesce: absolute
# ADR-0010, consolidation plan C14: as object.add_shape's, naming the
# target whose recipe refused.
refusals:
  - code: unknown_generator
    message: refusal.unknown_generator
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: generator_version
    message: refusal.generator_version
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: unknown_part
    message: refusal.unknown_part
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: moving_parts_fused
    message: refusal.moving_parts_fused
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: too_few_knuckles
    message: refusal.too_few_knuckles
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: pin_too_wide
    message: refusal.pin_too_wide
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: leaf_too_thick
    message: refusal.leaf_too_thick
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: hinge_too_short
    message: refusal.hinge_too_short
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text
  - code: leaf_failed
    message: refusal.leaf_failed
    next: none
    args:
      - name: name
        kind: text
      - name: detail
        kind: text

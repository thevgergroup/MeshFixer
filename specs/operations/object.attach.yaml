id: object.attach
version: 1
summary: Join N parts onto the objects they connect, each to its target slot (solids joined, holes cut), as one command - a linked group's member objects and generators built in place.
history_label: history.label.object.attach
geometry_kinds: [mesh]
# Side A: receives every member marked side 'a'.
target:
  whole_object: true
  kinds: []
operands:
  # Side B: receives every member marked side 'b'.
  - name: side_b
    role: changed
    kinds: [object]
    required: false
  # The members, in order, each removed once joined.
  - name: members
    role: consumed
    kinds: [object]
    required: false
    many: true
parameters:
  - name: members
    type: text
    default: "[]"
    description: "Each member's side and role, as JSON, in order: [{side: 'a' or 'b', hole: true or false}]"
  - name: generated
    type: text
    default: "[]"
    description: "Generators built and joined in this same step, with no member objects placed first, as JSON: [{generator: {id, version, params}, transform}]; each part goes to the target its attach_to names (A the target, B side_b), a loose part becoming its own object"
  - name: gap
    type: float
    default: 0.0
    min: 0.0
    unit: mm
    description: "Moving parts: the two sides must stay at least this far apart where they meet (0: don't check)"
preconditions:
  - one role per member
  - every member and side is a closed mesh
postconditions:
  - each side is combined with its members exactly as mesh.combine does (solids joined, then holes cut, each step checked)
  - the members are removed; undo restores them
  - each loose part of a generated member becomes its own object, at the member's transform
  - with a gap, the two sides are at least that far apart (otherwise moving_parts_fused, and nothing commits)
effects: [geometry_changes, topology_changes, removes_objects, creates_objects]
runtime:
  cancellable: true
  progress: false
# ADR-0010, consolidation plan C14: moving_parts_fused carries its gap
# as mf_units::Length (never a hard-coded "mm" or a bare {:.3}), plus
# every mesh.boolean/mesh.combine code a member-joining step can
# return, named by object through refuse_naming.
refusals:
  - code: moving_parts_fused
    message: refusal.moving_parts_fused
    next: none
    args:
      - name: a
        kind: text
      - name: b
        kind: text
      - name: measured
        kind: length
      - name: expected
        kind: length
  - code: operand_not_closed
    message: refusal.operand_not_closed
    next: repair
    args:
      - name: object
        kind: text
  - code: tool_not_closed
    message: refusal.tool_not_closed
    next: repair
    args:
      - name: object
        kind: text
  - code: operand_overlaps_itself
    message: refusal.operand_overlaps_itself
    next: run_make_solid
    args:
      - name: object
        kind: text
  - code: section_self_intersects
    message: refusal.section_self_intersects
    next: run_make_solid
    args:
      - name: object
        kind: text
  - code: window_degenerate
    message: refusal.window_degenerate
    next: run_make_solid
    args:
      - name: object
        kind: text

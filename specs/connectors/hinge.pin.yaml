id: hinge.pin
version: 1
summary: Print-in-place pin hinge, two leaves of knuckles around a captive pin.
geometry_kinds: [mesh]
target:
  whole_object: true
  kinds: []
parameters:
  - name: length
    type: float
    default: 30.0
    min: 1.0
    unit: mm
    description: "Overall length of the hinge along its axis"
  - name: knuckle_diameter
    type: float
    default: 6.0
    min: 1.0
    unit: mm
    description: "Diameter of each knuckle"
  - name: knuckles
    type: integer
    default: 5
    min: 3
    description: "Number of knuckles along the hinge (odd, so the two leaves interleave evenly)"
  - name: leaf_width
    type: float
    default: 10.0
    min: 1.0
    unit: mm
    description: "Radial size of each knuckle's connection to its leaf (reserved for the leaf wing)"
  - name: leaf_thickness
    type: float
    default: 2.4
    min: 0.4
    unit: mm
    description: "Thickness of each leaf's wing (reserved; not yet generated)"
  - name: pin_diameter
    type: float
    default: 2.5
    min: 0.5
    unit: mm
    description: "Diameter of the captive pin running through every knuckle"
  - name: gap
    type: float
    default: 0.4
    min: 0.0
    unit: mm
    default_from: fit.hinge_gap
    fit_role: clearance
    description: "Axial gap between neighbouring knuckles, and the pin's radial clearance in leaf_b's bore (from the print fit profile)"
  - name: open_angle
    type: float
    default: 0.0
    unit: deg
    description: "Rotation of leaf_b about the hinge axis from leaf_a, the print pose"
preconditions:
  - knuckles is odd and at least 3
  - pin_diameter is less than knuckle_diameter
effects: [geometry_changes]
runtime:
  cancellable: false
  progress: false

id: hinge.flap
version: 1
summary: Flap hinge, two flat leaves of knuckles around a pin, printed in place or separately.
geometry_kinds: [mesh]
target:
  whole_object: true
  kinds: []
parameters:
  - name: length
    type: float
    default: 30.0
    min: 1.0
    unit: mm
    description: "Overall length of the hinge along its axis"
  - name: knuckle_diameter
    type: float
    default: 6.0
    min: 1.0
    unit: mm
    description: "Diameter of each knuckle"
  - name: knuckles
    type: integer
    default: 5
    min: 3
    description: "Number of knuckles along the hinge (odd, so the two leaves interleave evenly)"
  - name: leaf_width
    type: float
    default: 10.0
    min: 1.0
    unit: mm
    description: "How far each leaf's flat wing reaches out from the knuckles, radially"
  - name: leaf_thickness
    type: float
    default: 2.4
    min: 0.4
    unit: mm
    description: "Thickness of each leaf's flat wing"
  - name: pin_diameter
    type: float
    default: 2.5
    min: 0.5
    unit: mm
    description: "Diameter of the pin running through every knuckle"
  - name: gap
    type: float
    default: 0.4
    min: 0.0
    unit: mm
    default_from: fit.hinge_gap
    description: "Radial clearance between the pin and a bore (leaf_b's knuckles, or both leaves' knuckles with a separate pin), and the axial gap between neighbouring knuckles (from the print fit profile)"
  - name: pin_mode
    type: choice
    default: captive
    values: [captive, separate]
    description: "captive: the pin is fused into leaf_a and printed in place (no assembly). separate: the pin is its own loose part, printed apart and inserted after, so both leaves' knuckles are bored to clear it"
  - name: open_angle
    type: float
    default: 0.0
    unit: deg
    description: "Rotation of leaf_b about the hinge axis from leaf_a, the print pose"
preconditions:
  - knuckles is odd and at least 3
  - pin_diameter is less than knuckle_diameter
effects: [geometry_changes]
runtime:
  cancellable: false
  progress: false

id: joint.peg
version: 1
summary: "A peg across a cut: attached to the piece it was placed on, fitting a hole in the other piece."
history_label: history.label.generator
geometry_kinds: [mesh]
# Local frame: see joint.dowel.yaml.
target:
  whole_object: true
  kinds: []
parameters:
  - name: diameter
    type: float
    default: 5.0
    min: 0.5
    unit: mm
    description: "Diameter of the hole in the other piece (the peg is the clearance thinner)"
  - name: depth_on
    type: float
    default: 3.0
    min: 0.1
    unit: mm
    description: "How far the peg is sunk into the piece it's attached to (so it joins it solidly)"
  - name: depth_other
    type: float
    default: 6.0
    min: 0.5
    unit: mm
    description: "How deep the hole goes into the other piece; the peg sticks out this far less the length allowance"
  - name: clearance
    type: float
    default: 0.2
    unit: mm
    fit_role: hole
    description: "The peg is this much thinner than its hole (diametral)"
  - name: length_allowance
    type: float
    default: 0.4
    min: 0.0
    unit: mm
    description: "Room left at the hole's floor"
  - name: gap
    type: float
    default: 0.0
    min: 0.0
    unit: mm
    description: "The cut's own gap between the two caps"
  - name: shape
    type: choice
    default: round
    values: [round, square, n_sided, keyed]
    description: "Cross-section, as an anti-rotation shape (D22): round, square, N-sided (see sides) or keyed (a D, one flat); a placement records it as its index here"
  - name: sides
    type: float
    default: 6.0
    min: 3.0
    max: 12.0
    description: "Corners of the N-sided shape (only read when shape is 2)"
  - name: hole_profile
    type: choice
    default: auto
    values: [auto, round, teardrop, flat_top]
    description: "The round holes' cross-section (D24): auto (teardrop when the hole prints sideways, within 45 degrees of horizontal), round, teardrop or flat-top"
  - name: profile
    type: float
    default: 0.0
    min: 0.0
    max: 2.0
    description: "What auto resolved to for this placement (0 round, 1 teardrop, 2 flat-top); recorded so replay is Exact"
  - name: up_x
    type: float
    default: 0.0
    min: -1.0
    max: 1.0
    description: "Which way a teardrop's point faces in the connector's own x/y (world up as seen from the hole), x part"
  - name: up_y
    type: float
    default: 1.0
    min: -1.0
    max: 1.0
    description: "Which way a teardrop's point faces in the connector's own x/y, y part"
  - name: overhang
    type: float
    default: 45.0
    min: 1.0
    max: 89.0
    unit: deg
    description: "The steepest overhang the printer handles, from vertical (the teardrop's flank angle)"
preconditions:
  - the clearance is less than the diameter
  - the hole is deeper than the length allowance
effects: [geometry_changes]
runtime:
  cancellable: false
  progress: false

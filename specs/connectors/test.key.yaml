id: test.key
version: 1
summary: "Test-only (test-kinds): a square key across a cut - a solid key on the piece it's placed on, its socket in the other."
geometry_kinds: [mesh]
# Local frame (every cut-face connector): z is the cut's normal, from the
# piece it was placed on (side A) into the other piece (side B); side A's
# cap is at z = -gap/2, side B's at z = +gap/2; centred at x = y = 0.
target:
  whole_object: true
  kinds: []
parameters:
  - name: width
    type: float
    default: 4.0
    min: 0.5
    unit: mm
    description: "Width of the socket; the key is the clearance narrower"
  - name: depth_on
    type: float
    default: 4.0
    min: 0.5
    unit: mm
    description: "How far the key is sunk into the piece it was placed on"
  - name: depth_other
    type: float
    default: 4.0
    min: 0.5
    unit: mm
    description: "How deep the socket goes into the other piece"
  - name: clearance
    type: float
    default: 0.2
    unit: mm
    fit_role: hole
    description: "The key is this much narrower than its socket (the chosen Fit class plus the Machine profile's hole compensation)"
  - name: gap
    type: float
    default: 0.0
    min: 0.0
    unit: mm
    description: "The cut's own gap between the two caps"
preconditions:
  - the clearance is less than the width
effects: [geometry_changes]
runtime:
  cancellable: false
  progress: false

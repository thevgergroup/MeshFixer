id: hinge.leaf
version: 1
summary: "Print-in-place pin hinge as three separate pieces: leaf A (the odd knuckles), leaf B (the even knuckles) and the pin, each attached to its own object."
geometry_kinds: [mesh]
# Local frame: x runs along the hinge axis (0 to length); the two objects
# meet across y = 0 (side A at -y, side B at +y); z = 0 is the face the
# leaves lie on (the objects behind it, at -z), the axis at
# z = knuckle_diameter / 2 + gap above it. Side B opens by turning about
# +x.
target:
  whole_object: true
  kinds: []
parameters:
  - name: knuckles
    type: integer
    default: 5
    min: 2
    description: "Number of knuckles along the hinge: leaf A takes the 1st, 3rd, 5th..., leaf B the 2nd, 4th..."
  - name: length
    type: float
    default: 30.0
    min: 2.0
    unit: mm
    description: "Total length of the hinge along its axis"
  - name: knuckle_diameter
    type: float
    default: 6.0
    min: 1.0
    unit: mm
    description: "Outside diameter of each knuckle"
  - name: pin_diameter
    type: float
    default: 2.5
    min: 0.5
    unit: mm
    description: "Diameter of the pin"
  - name: leaf_width
    type: float
    default: 8.0
    min: 1.0
    unit: mm
    description: "How far each leaf reaches across its own object's face"
  - name: leaf_thickness
    type: float
    default: 2.0
    min: 0.4
    unit: mm
    description: "Thickness of each leaf where it lies on its object's face"
  - name: gap
    type: float
    default: 0.3
    unit: mm
    fit_role: outer_xy
    description: "Knuckle-to-knuckle gap, and every other gap between the two moving sides (from the Fit class and Machine profile)"
  - name: pin_clearance
    type: float
    default: 0.3
    unit: mm
    fit_role: hole
    description: "Radial clearance between the pin and every knuckle's bore (from the Fit class and Machine profile)"
  - name: pin_mode
    type: choice
    default: captive
    values: [captive, separate]
    description: "captive: the pin prints in place, trapped by a head at each end. separate: a loose pin printed beside the hinge, pushed in after"
  - name: open_limit
    type: float
    default: 180.0
    min: 1.0
    max: 360.0
    unit: deg
    description: "How far side B opens; the swing preview checks this whole range"
  - name: fit_class
    type: text
    default: "Free running"
    fit_role: fit_class_name
    description: "The Fit class the gaps were resolved from"
  - name: machine_profile
    type: text
    default: "Uncalibrated"
    fit_role: machine_profile_name
    description: "The Machine profile the gaps were resolved from"
preconditions:
  - gap and pin_clearance are more than 0 (otherwise the moving parts would print fused)
  - pin_diameter is less than knuckle_diameter
  - the hinge is long enough for its knuckles and gaps
effects: [geometry_changes]
runtime:
  cancellable: false
  progress: false

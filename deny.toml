[graph]
all-features = false

[licenses]
# MF-ARCH-LEGAL-001: permissive licences only for mandatory dependencies.
# MPL-2.0 is file-level copyleft and compatible with MIT/Apache distribution; review under OD-5.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "CC0-1.0", "MPL-2.0",
]
confidence-threshold = 0.9

# egui's bundled default fonts. OFL-1.1 and the Ubuntu Font Licence govern the
# font files only (bundling and redistribution allowed) and place no
# obligations on MeshFixer code. Scoped to this crate; reviewed 2026-11-08.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
